name: Emulator Tests

on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    env:
      ANDROID_SERIAL: emulator-5554
      APPIUM_TEST_APP_PACKAGE: io.appium.quoteargs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install dependencies and build driver
        run: |
          npm install --no-package-lock
          npm run build
      - name: Build fixture APK
        run: |
          sdkmanager "platforms;android-34" "build-tools;36.0.0"
          bash test/fixtures/quote-probe/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb -s "$ANDROID_SERIAL" install -r build/quote-probe/probe.apk
            npm run test:emulator
